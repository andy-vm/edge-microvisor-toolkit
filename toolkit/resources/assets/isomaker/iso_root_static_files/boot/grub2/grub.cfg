set timeout=0

# The use of mariner.media=CDROM is a workaround that our installer does not require
# but it is observed to be needed to boot on some hardware/SoCs.
menuentry "Edge Microvisor Toolkit" {
    search --label CDROM --set root
    linux /isolinux/vmlinuz root=/dev/ram0 mariner.media=CDROM sysctl.kernel.unprivileged_bpf_disabled=1 console=tty0 console=ttyS0,115200n8 intel_pstate=disable rd.debug rd.udev.log_level=debug rd.timeout=0 systemd.log_level=debug systemd.log_target=kmsg log_buf_len=1M printk.devkmsg=on systemd.debug-shell=1 systemd.unit=emergency.target rd.memdebug=5 rd.live.debug=1 loglevel=7
    initrd /isolinux/initrd.img
}
